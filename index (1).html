<script>
window.addEventListener('error',e=>toast('Error: '+(e.message||'unknown')));
const KEY='spendly_v1',PRICE=49,TRIAL=30;
/* ---- OWNER SETTINGS: fill these in before going live ---- */
const UPI_ID='YOUR-UPI-ID@bank',UPI_NAME='Spendly',OWNER_WA='918639705813',SECRET='change-this-secret-123',OWNER_PIN='1234';
const $=s=>document.querySelector(s),root=$('#root');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n||0);
const iso=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2));
const CATS=['Food','Transport','Shopping','Bills','Health','Fun','Other'];
const CC={Food:['🍜','#FFF1E5'],Transport:['🚕','#E8F4FF'],Shopping:['🛍️','#FDEBF4'],Bills:['🧾','#EAF7EE'],Health:['💊','#FFECEC'],Fun:['🎬','#F1EBFF'],Other:['✨','#EFEDFF']};
const QUOTES=['Every rupee you save today is a gift to your future self.','Small savings, made daily, grow into big dreams.','You are not just tracking money, you are building freedom.','A rupee saved is a worry avoided.','Awareness is the first step to wealth. You are already on it!','Little by little, a little becomes a lot.','Your future self just smiled at you.','Smart spenders build calm, confident lives.','Consistency beats big gestures. Keep going!','Today\'s discipline is tomorrow\'s freedom.','Money you track is money you control.','Proud of you for showing up for your goals.'];
const MOODS={expense:['🌱','Logged! Nice tracking','linear-gradient(135deg,#7C6BFF,#4F46E5)'],income:['🎉','Income added! Wonderful','linear-gradient(135deg,#22D3A5,#0E9F6E)'],budget:['🎯','Budget set! Smart move','linear-gradient(135deg,#FFB020,#F0652A)'],goal:['✨','Goal created! Dream big','linear-gradient(135deg,#FF6FA8,#8B5CF6)'],save:['💰','Savings added! Keep it up','linear-gradient(135deg,#27D3B5,#4F46E5)']};
let lastQ=-1;
function cheer(k){const m=MOODS[k]||MOODS.expense;let i;do{i=Math.floor(Math.random()*QUOTES.length)}while(i===lastQ);lastQ=i;document.querySelectorAll('.cheer,.toast').forEach(e=>e.remove());const e=document.createElement('div');e.className='cheer';e.style.background=m[2];e.setAttribute('role','status');e.innerHTML=`<span>${m[0]}</span><div><b>${m[1]}</b><small>${esc(QUOTES[i])}</small></div>`;document.body.append(e);setTimeout(()=>e.remove(),4800)}
const LOGO=`<svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C6BFF"/><stop offset="1" stop-color="#FF6FA8"/></linearGradient></defs><rect width="32" height="32" rx="10" fill="url(#lg)"/><path d="M21.5 11.5c-1-2-3.2-3-5.4-3-2.9 0-5 1.6-5 3.9 0 5.6 10.6 2.9 10.6 8.6 0 2.4-2.2 4-5.2 4-2.4 0-4.6-1-5.6-3" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="7.5" r="2.4" fill="#FFD166"/></svg>`;
const fresh=()=>({tx:[],bud:[],goals:[],name:'',pref:{push:false,morning:'08:30',evening:'20:30'},sub:null,trialStart:iso(new Date())});
let S;try{const d=JSON.parse(localStorage.getItem(KEY)||'null');S=d&&d.trialStart?Object.assign(fresh(),d):fresh()}catch(e){S=fresh()}
let V={view:'dash',type:'expense',filter:'all'};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save. Your browser storage may be full or blocked.')}}
function toast(t){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2800)}
save();

/* ---- TRIAL & SUBSCRIPTION ---- */
const elapsed=()=>Math.max(0,Math.round((new Date(iso(new Date()))-new Date(S.trialStart))/864e5));
const daysLeft=()=>Math.max(0,TRIAL-elapsed());
const subscribed=()=>S.sub&&S.sub.status==='active'&&S.sub.until>iso(new Date());
const locked=()=>!subscribed()&&daysLeft()<=0;
/* PAYMENT GATEWAY HOOK: connect Razorpay/Stripe/etc. here later. After a payment is VERIFIED ON A SERVER, set S.sub={status:'active'}. */
let payTimer;
const codeFor=t=>{const s=String(t).replace(/\s/g,'').toUpperCase()+SECRET;let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);return String((4294967296*(2097151&b)+(a>>>0))%1000000).padStart(6,'0')};

 $('#m').insertAdjacentHTML('beforeend',`<div class="top"><h1>Settings</h1></div><div class="grid"><form class="card" id="pf"><h3>Profile</h3><label for="dn">Your name</label><input id="dn" maxlength="60" value="${esc(S.name)}"><button class="btn sm" style="margin-top:14px">Save</button></form>
 <div class="card"><h3>Plan</h3><p>${subscribed()?'Spendly Premium · active until '+S.sub.until:`Free trial · ${daysLeft()} days left`}</p><p class="k">₹${PRICE}/month after the 30-day free trial.</p>${subscribed()?'':'<button class="btn sm" style="margin-top:14px" id="sub2">Subscribe</button>'}</div>
 <form class="card" id="nf"><h3>Reminders</h3><p class="k">A gentle nudge to log your spending. They show while Spendly is open in your browser.</p><div class="sw"><span>Browser notifications</span><input type="checkbox" id="pe" ${p.push?'checked':''}></div><div class="form" style="margin-top:12px"><div><label for="mt">Morning</label><input id="mt" type="time" value="${esc(p.morning)}"></div><div><label for="et">Evening</label><input id="et" type="time" value="${esc(p.evening)}"></div></div><button class="btn sm" style="margin-top:14px">Save reminders</button></form>
 <div class="card"><h3>Your data</h3><p class="k" style="margin-bottom:14px">Everything is stored privately on this device and browser only.</p><button class="btn sm alt" id="ex">Download my data</button> <button class="btn sm alt" id="pv">Privacy</button> <button class="btn sm danger" id="del">Erase all data</button></div></div>`);
 $('#sub')&&($('#sub').onclick=startPayment);$('#sub2')&&($('#sub2').onclick=startPayment);
 $('#pf').onsubmit=e=>{e.preventDefault();S.name=$('#dn').value.trim().slice(0,60);save();toast('Saved')};
 $('#nf').onsubmit=async e=>{e.preventDefault();if($('#pe').checked&&'Notification'in window&&Notification.permission==='default')await Notification.requestPermission();S.pref={push:$('#pe').checked,morning:$('#mt').value,evening:$('#et').value};save();toast('Saved')};
 $('#ex').onclick=exportData;
 $('#pv').onclick=()=>{const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card" role="dialog" aria-modal="true"><h3>Privacy</h3><p>Spendly has no accounts. Your name, transactions, budgets and goals are saved only in this browser on this device. We do not store them on our servers. If you use Ask Spendly, your question and entries are sent to an AI service only to answer you. Clearing your browser data or switching devices means they will not carry over, so download a copy from Settings if you want a backup.</p><p style="margin-top:10px" class="k">Replace this draft with your final policy before launch, especially once payments are added.</p><button class="btn sm" style="margin-top:14px" id="cl">Close</button></div>`;document.body.append(m);$('#cl').onclick=()=>m.remove()};
 $('#del').onclick=()=>{if(prompt('This erases all your Spendly data on this device. Type ERASE to confirm.')!=='ERASE')return;const t=S.trialStart,s=S.sub;S=fresh();S.trialStart=t;S.sub=s;save();V.view='dash';shell();toast('Data erased')};
}
setInterval(()=>{if(!S.pref.push||!('Notification'in window)||Notification.permission!=='granted'||locked())return;const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
 if([S.pref.morning,S.pref.evening].includes(hm)&&sessionStorage.getItem('rem')!==hm+iso(n)){sessionStorage.setItem('rem',hm+iso(n));new Notification('Spendly',{body:'Take a moment to log your spending.'})}},20000);
$('#boot').classList.add('hide');location.hash==='#owner'?ownerView():shell();
</script></body></html>
